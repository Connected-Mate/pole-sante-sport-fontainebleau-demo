  <title>Le mouvement, à votre rythme — Pôle Santé Sport</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/generated/sport-preview-photo.webp" as="image">
  <link rel="stylesheet" href="share-preview.css">
  <script>if (new URLSearchParams(location.search).get('capture') === '1') document.documentElement.classList.add('capture');</script>
</head>
<body>
  <main class="preview-page">
    <header class="preview-toolbar" aria-label="Commandes de l’aperçu">
      <p>Un nouvel élan.</p>
      <button type="button" id="replay">Rejouer l’animation</button>
    </header>
    <div class="card-frame">
      <article class="share-card" aria-labelledby="card-title">
        <div class="card-photo">
          <img src="assets/generated/sport-preview-photo.webp" width="1122" height="1402" alt="Une sportive en mouvement dans une lumière naturelle." decoding="sync" fetchpriority="high">
        </div>
        <div class="card-shade" aria-hidden="true"></div>
        <svg class="movement-line" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
          <path d="M637 741C597 625 644 505 771 467C898 429 985 457 1044 381C1101 308 1074 213 1237 178" />
        </svg>
        <div class="card-content">
          <div class="wordmark" aria-label="Pôle Santé Sport">
            <span class="brand-rule" aria-hidden="true"></span>
            <span>PÔLE<br>SANTÉ SPORT</span>
          </div>
          <div class="card-message">
            <p class="card-kicker">SANTÉ &amp; MOUVEMENT</p>
            <h1 id="card-title"><span>Le soin.</span><span>Le mouvement.</span><span class="warm">Votre rythme.</span></h1>
          </div>
          <p class="card-signature">L’attention au corps. L’envie d’avancer.</p>
        </div>
      </article>
    </div>
    <footer class="preview-footer">
      <p>Proposition de refonte · Aperçu public</p>
      <a href="index.html">Découvrir le site<svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5"/></svg></a>
    </footer>
  </main>
  <script>
    (() => {
      const capture = document.documentElement.classList.contains('capture');
      const frame = document.querySelector('.card-frame');
      const card = document.querySelector('.share-card');
      const button = document.querySelector('#replay');
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const resize = () => frame.style.setProperty('--card-scale', frame.clientWidth / 1200);
      new ResizeObserver(resize).observe(frame);
      resize();
      const syncMotion = () => {
        button.disabled = motion.matches;
        button.textContent = motion.matches ? 'Animations désactivées' : 'Rejouer l’animation';
        if (motion.matches) card.classList.remove('animate');
      };
      syncMotion();
      motion.addEventListener('change', syncMotion);
      const start = () => {
        if (capture || motion.matches) return;
        card.classList.remove('animate');
        void card.offsetWidth;
        card.classList.add('animate');
      };
      button.addEventListener('click', start);
      Promise.all([document.fonts.ready, document.querySelector('.card-photo img').decode().catch(() => {})]).then(() => {
        document.documentElement.dataset.previewReady = 'true';
        start();
      });
    })();
  </script>
</body>
</html>
